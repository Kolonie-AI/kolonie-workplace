name: Publish image

# Every merge to `main` publishes the workplace image to GHCR, so that
# `kolonie-infra` can pin an exact build. Without this the image from #27 exists
# only on whoever's laptop built it.
#
# **A separate workflow from `ci.yml`, and deliberately not a fifth check.** The
# four pull-request checks decide whether a change may land; this decides what
# is published once it has. Merging the two would mean either publishing from an
# unmerged branch or gating a merge on a registry push.
#
# **This publishes and does not deploy.** `kolonie-website` and
# `kolonie-platform` both end their build workflow by calling
# `kolonie-infra`'s reusable deploy; this one stops at the push on purpose.
# Issue #28 states it: the deploy decision stays in `kolonie-infra`, and
# `kolonie-infra#243` is the issue that consumes what this produces.

on:
  push:
    branches: [main]

# No `pull_request` trigger at all, which is what keeps a fork from ever
# reaching the registry: a workflow that does not run on pull requests cannot
# run on one from a fork, with or without push permission.
#
# No `workflow_dispatch` either. A manual run would build whatever `main` points
# at under a tag naming a commit somebody chose by hand, and the point of this
# workflow is that a published tag is a function of a merge.

env:
  IMAGE: ghcr.io/kolonie-ai/kolonie-workplace

jobs:
  publish:
    name: build and push ghcr.io/kolonie-ai/kolonie-workplace
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # `packages: write` is the whole of what this needs, and `contents: read`
    # narrows the default. The built-in GITHUB_TOKEN carries it for the duration
    # of the run: no personal access token, no stored registry credential, and
    # nothing in repository secrets to rotate or leak.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      # Before the registry login and before any build, so that a repository
      # missing one of the three values fails while nothing has been
      # authenticated and nothing can be pushed. Without this the build would
      # still refuse (the Dockerfile's `${NAME:?}` guards see to that), but it
      # would refuse after logging in and after uploading a build context, and
      # the reason would be buried in a Docker layer log rather than named by a
      # step whose title says what is wrong.
      #
      # The values arrive as `env:` on this step alone. They are tested with
      # `-z` and never echoed, expanded into a message or written to
      # `$GITHUB_OUTPUT`: the refusal names the *variable*, which is public, and
      # never its value. `vars` and not `secrets` because the workplace is a
      # public PKCE client — there is no client secret for it, on the tenant or
      # anywhere else — but a tenant host name and a client id are still
      # deployment configuration that `AGENTS.md` §3 keeps out of the tree.
      - name: Validate Auth0 build configuration
        env:
          VITE_AUTH0_DOMAIN: ${{ vars.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_CALLBACK: ${{ vars.VITE_AUTH0_CALLBACK }}
        run: |
          missing=""
          [ -z "${VITE_AUTH0_DOMAIN}" ] && missing="${missing} VITE_AUTH0_DOMAIN"
          [ -z "${VITE_AUTH0_CLIENT_ID}" ] && missing="${missing} VITE_AUTH0_CLIENT_ID"
          [ -z "${VITE_AUTH0_CALLBACK}" ] && missing="${missing} VITE_AUTH0_CALLBACK"
          if [ -n "${missing}" ]; then
            echo "::error::Refusing to publish: missing repository variables:${missing}"
            echo "Set them as Actions repository variables. Values are never printed here."
            exit 1
          fi
          echo "All three Auth0 build variables are configured."

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One timestamp for the run. `github.event.repository.updated_at` is the
      # expression that looks right for `created` and is not: it is when the
      # repository record last changed, which is neither this build nor
      # necessarily this commit.
      - id: built-at
        run: echo "iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # The Auth0 SPA configuration, read by Vite while the build stage
          # runs. `build-args` reach the build stage only; they are not `env:`
          # on the job, not labels on the image, and nothing writes them into
          # the nginx runtime — the Dockerfile declares the three `ARG`s inside
          # the build stage for exactly that reason.
          #
          # Buildx does not print a build argument's value, and none of these
          # is passed to a `RUN` that echoes it.
          build-args: |
            VITE_AUTH0_DOMAIN=${{ vars.VITE_AUTH0_DOMAIN }}
            VITE_AUTH0_CLIENT_ID=${{ vars.VITE_AUTH0_CLIENT_ID }}
            VITE_AUTH0_CALLBACK=${{ vars.VITE_AUTH0_CALLBACK }}
          # Both tags, and the commit SHA is the one that matters. `latest`
          # moves under whoever pulls it, so infra pins the SHA — or the digest
          # it resolves to — and gets a build that cannot change beneath it.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # So the image can say which commit built it, the same four labels
          # and the same shape as the website's and the platform's builds.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ steps.built-at.outputs.iso }}
            org.opencontainers.image.version=${{ github.sha }}
          # Layer cache, so a content-only commit reuses the `npm ci` layer
          # rather than rebuilding the toolchain.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `push: true` above means the push is part of the build step: a failing
      # `npm ci` or `npm run build` fails that step, and a step that failed has
      # pushed nothing. There is no `continue-on-error` and no `|| true`
      # anywhere in this file, so a red build is a red workflow and the tags it
      # would have written do not appear in the registry.
      - name: State the reference infra should pin
        run: |
          echo "published ${IMAGE}:${GITHUB_SHA}"
          docker buildx imagetools inspect "${IMAGE}:${GITHUB_SHA}" \
            --format '{{ .Manifest.Digest }}'
