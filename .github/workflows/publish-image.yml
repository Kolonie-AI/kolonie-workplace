name: Publish image

# Every merge to `main` publishes the workplace image to GHCR and then deploys
# that exact SHA to the host, so `workplace.kolonie.ai` is a function of a merge.
# Without the publish the image from #27 exists only on whoever's laptop built
# it. Without the deploy job the host kept serving a sixteen-build-old image
# while every Publish run reported green — measured 2026-08-28, issue #94.
#
# **A separate workflow from `ci.yml`, and deliberately not a fifth check.** The
# four pull-request checks decide whether a change may land; this decides what
# is published and served once it has. Merging the two would mean either
# publishing from an unmerged branch or gating a merge on a registry push.
#
# **This publishes and then deploys that SHA.** Same shape as `kolonie-website`
# and `kolonie-platform`. #28's non-goal ("publishing an image must not deploy
# it") is superseded by #94: the deploy decision is still `kolonie-infra`'s
# reusable workflow, called from here so nobody has to press it by hand.

on:
  push:
    branches: [main]

# No `pull_request` trigger at all, which is what keeps a fork from ever
# reaching the registry: a workflow that does not run on pull requests cannot
# run on one from a fork, with or without push permission.
#
# No `workflow_dispatch` either. A manual run would build whatever `main` points
# at under a tag naming a commit somebody chose by hand, and the point of this
# workflow is that a published tag is a function of a merge.

env:
  IMAGE: ghcr.io/kolonie-ai/kolonie-workplace

jobs:
  publish:
    name: build and push ghcr.io/kolonie-ai/kolonie-workplace
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # `packages: write` is the whole of what this needs, and `contents: read`
    # narrows the default. The built-in GITHUB_TOKEN carries it for the duration
    # of the run: no personal access token, no stored registry credential, and
    # nothing in repository secrets to rotate or leak.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      # Before the registry login and before any build, so that a repository
      # missing one of the five values fails while nothing has been
      # authenticated and nothing can be pushed. Without this the build would
      # still refuse (the Dockerfile's `test -s` guards see to that), but it
      # would refuse after logging in and after uploading a build context, and
      # the reason would be buried in a Docker layer log rather than named by a
      # step whose title says what is wrong.
      #
      # **`secrets` and not `vars`, and that is the correction this file exists
      # for.** Actions prints a step's `env:` block and every action input
      # verbatim in the public log, and repository *variables are not masked* —
      # only secrets are. The first attempt at #38 read these from `vars`, so
      # all three appeared in cleartext in the log of a public repository. The
      # runner redacts a secret everywhere it would otherwise print one, which
      # is the only mechanism that makes an unattended publication safe here.
      #
      # This says nothing about the values being credentials. The workplace is a
      # public PKCE client and there is no client secret for it, on the tenant or
      # anywhere else. `secrets` is used for its *masking*, and `AGENTS.md` §3 is
      # what asks that a tenant host name stay out of the log.
      #
      # The two preview identity values (#39) are validated here for the same
      # reasons and with more force: a provider and a subject name how one real
      # person signs in, and a build without them would publish green and then
      # throw `MissingPreviewIdentityConfiguration` in the browser.
      - name: Validate build configuration
        env:
          VITE_AUTH0_DOMAIN: ${{ secrets.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ secrets.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_CALLBACK: ${{ secrets.VITE_AUTH0_CALLBACK }}
          VITE_PREVIEW_IDENTITY_PROVIDER: ${{ secrets.VITE_PREVIEW_IDENTITY_PROVIDER }}
          VITE_PREVIEW_IDENTITY_SUBJECT: ${{ secrets.VITE_PREVIEW_IDENTITY_SUBJECT }}
        run: |
          missing=""
          [ -z "${VITE_AUTH0_DOMAIN}" ] && missing="${missing} VITE_AUTH0_DOMAIN"
          [ -z "${VITE_AUTH0_CLIENT_ID}" ] && missing="${missing} VITE_AUTH0_CLIENT_ID"
          [ -z "${VITE_AUTH0_CALLBACK}" ] && missing="${missing} VITE_AUTH0_CALLBACK"
          [ -z "${VITE_PREVIEW_IDENTITY_PROVIDER}" ] && missing="${missing} VITE_PREVIEW_IDENTITY_PROVIDER"
          [ -z "${VITE_PREVIEW_IDENTITY_SUBJECT}" ] && missing="${missing} VITE_PREVIEW_IDENTITY_SUBJECT"
          if [ -n "${missing}" ]; then
            echo "::error::Refusing to publish: missing repository secrets:${missing}"
            echo "Set them as Actions repository secrets. Values are never printed here."
            exit 1
          fi
          echo "All five build values are configured."

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One timestamp for the run. `github.event.repository.updated_at` is the
      # expression that looks right for `created` and is not: it is when the
      # repository record last changed, which is neither this build nor
      # necessarily this commit.
      - id: built-at
        run: echo "iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # The Auth0 SPA configuration and the preview identity mapping, read
          # by Vite while the build stage runs — as BuildKit secrets, never as
          # `build-args`.
          #
          # A build argument is recorded in the SLSA provenance buildx attaches
          # to the published image and is echoed onto the `docker buildx build`
          # command line in the log. That is how the first attempt at #38
          # published these values in an attestation blob. A secret mount is
          # neither: it lives only for the `RUN` that mounts it, and the echoed
          # command names the id rather than the value.
          #
          # These come from `secrets` rather than `vars` because the runner masks
          # a secret in the log and does not mask a variable — see the validation
          # step above for why that is the whole point.
          secrets: |
            auth0_domain=${{ secrets.VITE_AUTH0_DOMAIN }}
            auth0_client_id=${{ secrets.VITE_AUTH0_CLIENT_ID }}
            auth0_callback=${{ secrets.VITE_AUTH0_CALLBACK }}
            preview_identity_provider=${{ secrets.VITE_PREVIEW_IDENTITY_PROVIDER }}
            preview_identity_subject=${{ secrets.VITE_PREVIEW_IDENTITY_SUBJECT }}
          # Belt and braces after the exposure: buildx attaches a provenance
          # attestation by default, and that attestation is what carried the
          # values into the registry last time. Nothing here relies on it, and
          # the secret mounts above are already absent from it — but an image
          # this workflow publishes should not grow a new metadata surface for
          # build inputs without somebody deciding to.
          provenance: false
          # Both tags, and the commit SHA is the one that matters. `latest`
          # moves under whoever pulls it, so infra pins the SHA — or the digest
          # it resolves to — and gets a build that cannot change beneath it.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # So the image can say which commit built it, the same four labels
          # and the same shape as the website's and the platform's builds.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ steps.built-at.outputs.iso }}
            org.opencontainers.image.version=${{ github.sha }}
          # Layer cache, so a content-only commit reuses the `npm ci` layer
          # rather than rebuilding the toolchain.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `push: true` above means the push is part of the build step: a failing
      # `npm ci` or `npm run build` fails that step, and a step that failed has
      # pushed nothing. There is no `continue-on-error` and no `|| true`
      # anywhere in this file, so a red build is a red workflow and the tags it
      # would have written do not appear in the registry.
      - name: State the reference infra should pin
        run: |
          echo "published ${IMAGE}:${GITHUB_SHA}"
          docker buildx imagetools inspect "${IMAGE}:${GITHUB_SHA}" \
            --format '{{ .Manifest.Digest }}'

  # The step that was missing here, and that kolonie-website's workflow has had
  # since it reproduced the same failure: pushing the image was the end of this
  # file, so every merge rebuilt GHCR and production kept serving whatever had
  # last been deployed by hand. #94 reverses that. `version: github.sha` rather
  # than `latest` because deploy.sh refuses the mutable tag, and a mutable tag
  # would ship whatever finished building most recently, which need not be this
  # commit.
  deploy:
    name: deploy ghcr.io/kolonie-ai/kolonie-workplace:${{ github.sha }} to the VPS
    needs: publish
    uses: Kolonie-AI/kolonie-infra/.github/workflows/deploy.yml@main
    with:
      service: workplace
      version: ${{ github.sha }}
    # Named, not inherited: the called workflow declares exactly these two.
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    permissions:
      contents: read
      packages: read
