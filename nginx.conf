server {
    listen 80;
    # The health check resolves `localhost`, and musl answers with the IPv6
    # loopback first. With `listen 80` alone nginx binds IPv4 only, so the
    # probe got `wget: can't connect to remote host: Connection refused` and
    # the container sat in `starting` for ever — measured on 2026-08-27, two
    # failing probes before this line was added. Traefik reaches the container
    # over the Docker network on either stack; this is what makes the two agree.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # `/health` is answered before anything can fall through to the shell, and
    # `return` is what keeps it that way: nothing here opens a file, so a broken
    # or missing bundle cannot make this endpoint look healthy. That distinction
    # is the point of the endpoint — kolonie-infra/AGENTS.md §3 has the deploy
    # script and the Docker health check both reading it, and a health check
    # answering `index.html` under 200 is indistinguishable from a working app.
    #
    # An exact-match location, so it can never be reached by the SPA fallback
    # below, and `access_log off` because a health check runs continuously and
    # would otherwise be most of the log.
    #
    # `default_type` and not `add_header Content-Type`: measured against this
    # image on 2026-08-27, the `add_header` form emitted the header *twice* —
    # `application/octet-stream` from the default type, then `text/plain` — and
    # a client that reads the first one is told the endpoint returns a binary.
    # `default_type` replaces the type instead of appending to it.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The workplace is a single-page application: the browser owns the routing,
    # so a path the server has never heard of is still a page the application
    # can render. `/sign-in/callback` — the Auth0 redirect target from #2 — is
    # the one that breaks loudly without this, because Auth0 sends the browser
    # there and nothing on disk has that name.
    #
    # `/index.html` as the last argument is deliberately a *file* and not
    # `=404`: the shell is served, under 200, for any path that is not an asset.
    # The website's config ends its chain with `=404` for the opposite reason —
    # it is statically rendered, so a missing path there really is missing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints everything under `/assets/`, so those are safe to cache
    # hard; `index.html` is not, because a deploy must be visible immediately.
    # This block has no `try_files`, so a missing asset is a real 404 rather
    # than the shell served under an asset's name — a bundle referencing a file
    # that is not in the image should fail visibly, not return HTML to a
    # `<script>` tag.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
